# Reusable quality gate. Called by ci.yml (pull requests) and by deploy.yml (the merge commit being deployed), so the
# same checks run on the exact commit that gets deployed.
name: checks

on:
  workflow_call:
    secrets:
      DATABRICKS_HOST:
        required: false
      DATABRICKS_CLIENT_ID:
        required: false
      DATABRICKS_CLIENT_SECRET:
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # PySpark 4 needs Java 17 or newer for the local Spark tests.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Workflow lint
        run: actionlint
      - name: Tests
        run: python -m pytest -q

  bundle-validate:
    # Fork pull requests get no secrets, so this job is skipped for them; every other trigger must pass it.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
      BUNDLE_VAR_run_as_service_principal: ${{ secrets.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # v1.22.1
      - name: Require Databricks credentials (fail closed)
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_CLIENT_ID" ] || [ -z "$DATABRICKS_CLIENT_SECRET" ]; then
            echo "::error::Databricks secrets are not configured; see docs/CICD.md"
            exit 1
          fi
      - name: Authentication smoke check
        run: databricks current-user me > /dev/null
      - name: Validate production bundle
        run: databricks bundle validate -t prod > /dev/null
